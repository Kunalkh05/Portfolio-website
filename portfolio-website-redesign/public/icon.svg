<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: light) {
      .background { fill: #0f172a; }
      .foreground { stroke: #2dd4bf; }
    }
    @media (prefers-color-scheme: dark) {
      .background { fill: #030712; }
      .foreground { stroke: #2dd4bf; }
    }
  </style>
  <rect class="background" width="180" height="180" rx="45" />
  <g style="transform: scale(90%); transform-origin: center">
    <!-- Vertical stem -->
    <path class="foreground" d="M 60 45 L 60 135" stroke-width="16" stroke-linecap="round" />
    <!-- Diagonal up -->
    <path class="foreground" d="M 60 95 L 120 45" stroke-width="16" stroke-linecap="round" />
    <!-- Diagonal down -->
    <path class="foreground" d="M 85 75 L 125 135" stroke-width="16" stroke-linecap="round" />
  </g>
</svg>